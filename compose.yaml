services:
  clickhouse:
    build:
      context: .
      dockerfile: Containerfile
    image: ghcr.io/datopsis/clickhouse-ubi:local
    environment:
      CLICKHOUSE_PASSWORD: change-me
    ports:
      - "18123:8123"
      - "19000:9000"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  clickhouse-data:

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Connected and disconnected TLS trust flows</title><desc id="desc">The connected deployment trusts public and private certificate authorities. The disconnected deployment trusts only its internal authority and endpoint, has no public egress, and performs local renewal and rollback.</desc>
  <defs><style>.bg{fill:#f8fafc}.zone{fill:#fff;stroke:#475569;stroke-width:2}.server{fill:#e0f2fe;stroke:#0369a1;stroke-width:3}.ca{fill:#fef3c7;stroke:#92400e;stroke-width:2}.ok{fill:#dcfce7;stroke:#15803d;stroke-width:2}.deny{fill:#fee2e2;stroke:#b91c1c;stroke-width:2}.t{font:700 22px system-ui;fill:#0f172a}.h{font:700 17px system-ui;fill:#0f172a}.p{font:13px system-ui;fill:#334155}.a{stroke:#15803d;stroke-width:2;fill:none;marker-end:url(#g)}.x{stroke:#b91c1c;stroke-width:3;stroke-dasharray:8 6}</style><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#15803d"/></marker></defs>
  <rect class="bg" width="1200" height="700"/><text class="t" x="40" y="45">TLS trust flows</text>
  <rect class="zone" x="30" y="80" width="550" height="570" rx="18"/><text class="h" x="210" y="115">Connected deployment</text><rect class="server" x="190" y="270" width="230" height="120" rx="14"/><text class="h" x="245" y="310">ClickHouse</text><text class="p" x="220" y="340">Leaf + intermediate + key</text><text class="p" x="220" y="365">Public + private CA trust</text><rect class="ok" x="55" y="155" width="170" height="75" rx="10"/><text class="h" x="105" y="185">Clients</text><text class="p" x="75" y="210">Verify CA + hostname</text><rect class="ca" x="355" y="145" width="180" height="90" rx="10"/><text class="h" x="390" y="178">Enterprise CA</text><text class="p" x="375" y="205">Signs leaf; key stays local</text><rect class="ok" x="55" y="465" width="190" height="90" rx="10"/><text class="h" x="90" y="498">Public services</text><text class="p" x="75" y="525">System public trust bundle</text><rect class="ok" x="340" y="465" width="195" height="90" rx="10"/><text class="h" x="375" y="498">Private services</text><text class="p" x="360" y="525">Enterprise CA trust bundle</text><path class="a" d="M225 200L275 270"/><path class="a" d="M420 235L360 270"/><path class="a" d="M265 390L180 465"/><path class="a" d="M345 390L420 465"/>
  <rect class="zone" x="620" y="80" width="550" height="570" rx="18"/><text class="h" x="790" y="115">Disconnected deployment</text><rect class="server" x="780" y="270" width="230" height="120" rx="14"/><text class="h" x="835" y="310">ClickHouse</text><text class="p" x="805" y="340">Internal leaf + chain + key</text><text class="p" x="805" y="365">Internal CA trust only</text><rect class="ok" x="650" y="155" width="170" height="75" rx="10"/><text class="h" x="700" y="185">Clients</text><text class="p" x="670" y="210">Internal DNS and CA</text><rect class="ca" x="950" y="145" width="185" height="90" rx="10"/><text class="h" x="980" y="178">Offline/internal CA</text><text class="p" x="970" y="205">CSR in; signed chain out</text><rect class="ok" x="650" y="465" width="205" height="90" rx="10"/><text class="h" x="690" y="498">Internal services</text><text class="p" x="675" y="525">Private CA validation</text><rect class="deny" x="940" y="465" width="195" height="90" rx="10"/><text class="h" x="980" y="498">Public network</text><text class="p" x="970" y="525">Egress denied</text><path class="a" d="M820 200L860 270"/><path class="a" d="M1015 235L950 270"/><path class="a" d="M850 390L770 465"/><path class="x" d="M1010 390L1030 465"/><path class="x" d="M1008 410L1032 390"/><text class="p" x="765" y="615">Renewal and rollback use retained internal artifacts; no CA private key enters workload</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Security control ownership and SCTM consumption</title><desc id="desc">The image repository, deployment repository, platform, and organization contribute evidence to a system cyber team, which resolves the final SCTM and authorization package.</desc>
  <defs><style>.bg{fill:#f8fafc}.img{fill:#e0f2fe;stroke:#0369a1;stroke-width:2}.dep{fill:#dcfce7;stroke:#15803d;stroke-width:2}.plat{fill:#fef3c7;stroke:#92400e;stroke-width:2}.org{fill:#f3e8ff;stroke:#7e22ce;stroke-width:2}.cyber{fill:#fff;stroke:#0f172a;stroke-width:3}.t{font:700 22px system-ui;fill:#0f172a}.h{font:700 16px system-ui;fill:#0f172a}.p{font:13px system-ui;fill:#334155}.a{stroke:#475569;stroke-width:2;fill:none;marker-end:url(#a)}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#475569"/></marker></defs>
  <rect class="bg" width="1200" height="650"/><text class="t" x="40" y="45">Control ownership and SCTM consumption</text>
  <rect class="img" x="45" y="105" width="250" height="150" rx="14"/><text class="h" x="90" y="140">Image repository</text><text class="p" x="70" y="172">Immutable image controls</text><text class="p" x="70" y="198">ClickHouse config capabilities</text><text class="p" x="70" y="224">Tests, SBOM, scanner evidence</text>
  <rect class="dep" x="335" y="105" width="250" height="150" rx="14"/><text class="h" x="365" y="140">Production stack repo</text><text class="p" x="360" y="172">Deployment profiles</text><text class="p" x="360" y="198">Network, secrets, backup</text><text class="p" x="360" y="224">Topology and operations</text>
  <rect class="plat" x="625" y="105" width="250" height="150" rx="14"/><text class="h" x="690" y="140">Platform</text><text class="p" x="650" y="172">Kernel, runtime, SELinux</text><text class="p" x="650" y="198">Storage, ingress, identity</text><text class="p" x="650" y="224">Inherited platform evidence</text>
  <rect class="org" x="915" y="105" width="250" height="150" rx="14"/><text class="h" x="980" y="140">Organization</text><text class="p" x="940" y="172">Policy and ODP values</text><text class="p" x="940" y="198">People, process, physical</text><text class="p" x="940" y="224">Risk acceptance</text>
  <rect class="cyber" x="325" y="365" width="550" height="200" rx="18"/><text class="h" x="490" y="405">System owner / cyber team</text><text class="p" x="380" y="440">Imports OSCAL component definition or generated CSV</text><text class="p" x="380" y="470">Resolves authorization boundary, inheritance, applicability, and ODPs</text><text class="p" x="380" y="500">Runs assessment procedures and evaluates evidence</text><text class="p" x="380" y="530">Owns final SCTM, SSP, POA&amp;M, and authorization claims</text>
  <path class="a" d="M170 255V315H420V365"/><path class="a" d="M460 255V365"/><path class="a" d="M750 255V315H650V365"/><path class="a" d="M1040 255V315H780V365"/>
</svg>

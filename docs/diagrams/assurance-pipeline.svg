<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Build, qualification, release, and assurance evidence pipeline</title><desc id="desc">Pinned sources flow through native architecture builds, runtime tests, security analysis, evidence generation, review, signing, and registry publication.</desc>
  <defs><style>.bg{fill:#f8fafc}.b{fill:#fff;stroke:#475569;stroke-width:2}.gate{fill:#e0f2fe;stroke:#0369a1;stroke-width:2}.ev{fill:#dcfce7;stroke:#15803d;stroke-width:2}.t{font:700 22px system-ui;fill:#0f172a}.h{font:700 15px system-ui;fill:#0f172a}.p{font:12px system-ui;fill:#334155}.a{stroke:#475569;stroke-width:2;fill:none;marker-end:url(#a)}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#475569"/></marker></defs>
  <rect class="bg" width="1200" height="620"/><text class="t" x="40" y="45">Build, release, and assurance pipeline</text>
  <rect class="b" x="35" y="110" width="180" height="115" rx="12"/><text class="h" x="75" y="145">Pinned inputs</text><text class="p" x="55" y="175">UBI digests</text><text class="p" x="55" y="198">ClickHouse archives + SHA-512</text>
  <rect class="gate" x="270" y="90" width="210" height="155" rx="12"/><text class="h" x="315" y="125">Native builds</text><text class="p" x="300" y="155">AMD64 runner</text><text class="p" x="300" y="180">ARM64 runner</text><text class="p" x="300" y="205">Architecture assertion</text>
  <rect class="gate" x="535" y="80" width="255" height="175" rx="12"/><text class="h" x="590" y="115">Qualification gates</text><text class="p" x="565" y="145">Smoke + rootless storage</text><text class="p" x="565" y="170">Connected/disconnected TLS</text><text class="p" x="565" y="195">Trivy + Grype + CodeQL</text><text class="p" x="565" y="220">Tailored SCAP evaluation</text>
  <rect class="ev" x="845" y="90" width="310" height="155" rx="12"/><text class="h" x="925" y="125">Digest-bound evidence</text><text class="p" x="875" y="155">SPDX SBOM + vulnerability inventory</text><text class="p" x="875" y="180">Test logs + SCAP ARF/XCCDF</text><text class="p" x="875" y="205">Control matrix + source hashes</text>
  <rect class="b" x="300" y="360" width="250" height="120" rx="12"/><text class="h" x="360" y="398">Human review</text><text class="p" x="330" y="428">Applicability and residual risk</text><text class="p" x="330" y="453">Second-maintainer release review</text>
  <rect class="gate" x="650" y="350" width="230" height="140" rx="12"/><text class="h" x="700" y="388">Release workflow</text><text class="p" x="680" y="418">Multi-arch manifest</text><text class="p" x="680" y="443">Cosign + provenance</text><text class="p" x="680" y="468">Immutable tag</text>
  <rect class="ev" x="970" y="370" width="185" height="100" rx="12"/><text class="h" x="1015" y="408">GHCR</text><text class="p" x="995" y="438">Image + attestations</text>
  <path class="a" d="M215 165H270"/><path class="a" d="M480 165H535"/><path class="a" d="M790 165H845"/><path class="a" d="M1000 245V300H425V360"/><path class="a" d="M550 420H650"/><path class="a" d="M880 420H970"/>
</svg>

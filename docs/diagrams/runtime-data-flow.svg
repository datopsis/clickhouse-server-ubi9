<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">ClickHouse container runtime data flows</title><desc id="desc">Ingress, secrets, configuration, persistent data, logs, health, and outbound service flows are shown with their ports and trust boundaries.</desc>
  <defs><style>.bg{fill:#f8fafc}.b{fill:#fff;stroke:#475569;stroke-width:2}.core{fill:#e0f2fe;stroke:#0369a1;stroke-width:3}.sec{fill:#fee2e2;stroke:#b91c1c;stroke-width:2}.data{fill:#dcfce7;stroke:#15803d;stroke-width:2}.t{font:700 22px system-ui;fill:#0f172a}.h{font:700 16px system-ui;fill:#0f172a}.p{font:13px system-ui;fill:#334155}.a{stroke:#475569;stroke-width:2;fill:none;marker-end:url(#a)}.tls{stroke:#15803d}.plain{stroke:#b91c1c;stroke-dasharray:7 5}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#475569"/></marker></defs>
  <rect class="bg" width="1200" height="700"/><text class="t" x="40" y="45">Runtime data flow</text>
  <rect class="b" x="35" y="145" width="190" height="145" rx="12"/><text class="h" x="90" y="180">Clients</text><text class="p" x="55" y="215">TLS: 8443 / 9440</text><text class="p" x="55" y="245">Clear: 8123 / 9000</text><text class="p" x="55" y="270">Select one assessed profile</text>
  <rect class="core" x="400" y="120" width="400" height="360" rx="18"/><text class="h" x="520" y="160">ClickHouse process</text><rect class="b" x="455" y="195" width="290" height="65" rx="8"/><text class="h" x="530" y="222">Listener layer</text><text class="p" x="485" y="245">Authentication + optional TLS</text><rect class="b" x="455" y="290" width="290" height="65" rx="8"/><text class="h" x="520" y="318">Query engine</text><text class="p" x="495" y="342">SQL, integrations, access policy</text><rect class="b" x="455" y="385" width="290" height="65" rx="8"/><text class="h" x="525" y="413">Storage engine</text><text class="p" x="500" y="437">Configured paths and disks</text>
  <rect class="sec" x="305" y="535" width="210" height="110" rx="12"/><text class="h" x="345" y="570">Configuration</text><text class="p" x="330" y="597">ConfigMap / bind mount</text><text class="p" x="330" y="622">Password and TLS Secrets</text>
  <rect class="data" x="555" y="535" width="210" height="110" rx="12"/><text class="h" x="610" y="570">Persistent data</text><text class="p" x="585" y="597">/var/lib/clickhouse</text><text class="p" x="585" y="622">Additional configured disks</text>
  <rect class="b" x="890" y="115" width="260" height="110" rx="12"/><text class="h" x="965" y="150">Outbound services</text><text class="p" x="920" y="178">HTTPS / object storage / peers</text><text class="p" x="920" y="202">Strict trust per integration</text>
  <rect class="b" x="890" y="285" width="260" height="90" rx="12"/><text class="h" x="975" y="320">Health</text><text class="p" x="910" y="347">Dedicated loopback client + SELECT 1</text>
  <rect class="b" x="890" y="435" width="260" height="90" rx="12"/><text class="h" x="985" y="470">Logs</text><text class="p" x="920" y="497">Console to platform collector</text>
  <path class="a tls" d="M225 185H400"/><path class="a plain" d="M225 250H360V225H400"/><text class="p" x="245" y="170">Ingress</text><path class="a" d="M515 590H600V480"/><path class="a" d="M660 535V480"/><path class="a tls" d="M800 320H850V170H890"/><path class="a" d="M890 330H800"/><path class="a" d="M800 440H850V480H890"/>
</svg>

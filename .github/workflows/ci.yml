name: CI

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install pre-commit
        run: >-
          python -m pip install --require-hashes --only-binary=:all:
          --disable-pip-version-check
          --requirement .github/requirements/pre-commit.txt

      - name: Run repository checks
        run: pre-commit run --all-files --show-diff-on-failure

      - name: Test release tag validation
        run: bash tests/release-tag.sh

      - name: Test entrypoint path preparation
        run: bash tests/entrypoint-paths.sh

      - name: Test SPDX augmentation
        run: python -m unittest discover --start-directory tests --pattern "test_*.py"

      - name: Audit GitHub Actions security
        uses: zizmorcore/zizmor-action@70fb788f84895a7701f5643d103d587e460b5c99 # v0.6.3
        with:
          advanced-security: false
          annotations: true
          min-severity: medium

  image:
    name: image (${{ matrix.architecture }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
            platform: linux/amd64
            machine: x86_64
          - architecture: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
            machine: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    env:
      TEST_IMAGE: ghcr.io/datopsis/clickhouse-server-ubi9:test-${{ matrix.architecture }}
      SBOM_FILE: clickhouse-server-ubi9-${{ matrix.architecture }}.spdx.json
      GRYPE_SARIF: grype-${{ matrix.architecture }}.sarif
      GRYPE_ALL: grype-all-${{ matrix.architecture }}.json
      SCAP_SCANNER_IMAGE: localhost/datopsis-openscap:0.1.82-${{ matrix.architecture }}
      SCAP_RESULTS_DIR: scap-results-${{ matrix.architecture }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Confirm native runner architecture
        env:
          EXPECTED_MACHINE: ${{ matrix.machine }}
        run: test "$(uname -m)" = "${EXPECTED_MACHINE}"

      - name: Scan build configuration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH

      - name: Build test image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Containerfile
          platforms: ${{ matrix.platform }}
          load: true
          push: false
          tags: ${{ env.TEST_IMAGE }}
          cache-from: type=gha,scope=image-${{ matrix.architecture }}
          cache-to: type=gha,mode=max,scope=image-${{ matrix.architecture }}

      - name: Confirm loaded image architecture
        env:
          EXPECTED_ARCHITECTURE: ${{ matrix.architecture }}
        run: >-
          test "$(docker image inspect --format '{{.Architecture}}' "${TEST_IMAGE}")"
          = "${EXPECTED_ARCHITECTURE}"

      - name: Run smoke tests
        env:
          CONTAINER_RUNTIME: docker
          IMAGE: ${{ env.TEST_IMAGE }}
        run: bash tests/smoke.sh

      - name: Rehearse CA-issued TLS
        env:
          CONTAINER_RUNTIME: docker
          IMAGE: ${{ env.TEST_IMAGE }}
        run: bash tests/tls-rehearsal.sh

      - name: Build pinned OpenSCAP tool image
        id: build-scap
        continue-on-error: true
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Containerfile.scap
          platforms: ${{ matrix.platform }}
          load: true
          push: false
          tags: ${{ env.SCAP_SCANNER_IMAGE }}
          cache-from: type=gha,scope=scap-${{ matrix.architecture }}
          cache-to: type=gha,mode=max,scope=scap-${{ matrix.architecture }}

      - name: Run tailored SCAP stabilization scan
        id: scan-scap
        if: ${{ steps.build-scap.outcome == 'success' }}
        continue-on-error: true
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
          CONTAINER_RUNTIME: docker
          IMAGE: ${{ env.TEST_IMAGE }}
        run: bash scripts/scap-scan.sh

      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.TEST_IMAGE }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Generate SPDX SBOM with Syft
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ env.TEST_IMAGE }}
          format: spdx-json
          output-file: ${{ env.SBOM_FILE }}
          syft-version: v1.51.1
          upload-artifact: false
          upload-release-assets: false

      - name: Add declared ClickHouse TGZ components to SPDX SBOM
        run: >-
          python scripts/augment-spdx.py
          --input "${SBOM_FILE}"
          --output "${SBOM_FILE}"

      - name: Scan Syft SBOM with Grype
        id: grype
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          sbom: ${{ env.SBOM_FILE }}
          output-format: sarif
          output-file: ${{ env.GRYPE_SARIF }}
          severity-cutoff: high
          only-fixed: true
          fail-build: true
          cache-db: true
          grype-version: v0.118.0

      - name: Record all Grype findings
        if: ${{ always() && hashFiles(env.SBOM_FILE) != '' }}
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          sbom: ${{ env.SBOM_FILE }}
          output-format: json
          output-file: ${{ env.GRYPE_ALL }}
          severity-cutoff: negligible
          only-fixed: false
          fail-build: false
          cache-db: true
          grype-version: v0.118.0

      - name: Retain security artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-security-${{ github.sha }}-${{ matrix.architecture }}
          path: |
            ${{ env.SBOM_FILE }}
            ${{ env.GRYPE_SARIF }}
            ${{ env.GRYPE_ALL }}
            ${{ env.SCAP_RESULTS_DIR }}/
          if-no-files-found: warn
          retention-days: 14

      - name: Publish Grype findings to code scanning
        if: ${{ always() && github.event_name != 'pull_request' && hashFiles(env.GRYPE_SARIF) != '' }}
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: ${{ env.GRYPE_SARIF }}
          category: grype-image-${{ matrix.architecture }}

      - name: Require successful SCAP evaluation
        if: ${{ always() }}
        env:
          SCAP_BUILD_OUTCOME: ${{ steps.build-scap.outcome }}
          SCAP_SCAN_OUTCOME: ${{ steps.scan-scap.outcome }}
        run: |
          test "${SCAP_BUILD_OUTCOME}" = success
          test "${SCAP_SCAN_OUTCOME}" = success

  image-result:
    name: image
    if: ${{ always() }}
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every native image job
        env:
          MATRIX_RESULT: ${{ needs.image.result }}
        run: test "${MATRIX_RESULT}" = success

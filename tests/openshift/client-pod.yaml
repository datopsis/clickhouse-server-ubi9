apiVersion: v1
kind: Pod
metadata:
  name: clickhouse-qualification-client
  labels:
    app.kubernetes.io/name: clickhouse-qualification-client
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: client
      image: IMAGE_REFERENCE
      imagePullPolicy: IfNotPresent
      command:
        - bash
        - -c
        - sleep 1800
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
      volumeMounts:
        - name: temporary
          mountPath: /tmp
        - name: config
          mountPath: /etc/clickhouse-client/client.xml
          subPath: client.xml
          readOnly: true
        - name: ca
          mountPath: /run/secrets/clickhouse-ca
          readOnly: true
        - name: password
          mountPath: /run/secrets/clickhouse-password
          readOnly: true
  volumes:
    - name: temporary
      emptyDir:
        medium: Memory
        sizeLimit: 64Mi
    - name: config
      configMap:
        name: clickhouse-qualification-config
        defaultMode: 0444
    - name: ca
      secret:
        secretName: clickhouse-ca
        defaultMode: 0444
    - name: password
      secret:
        secretName: clickhouse-password
        defaultMode: 0440

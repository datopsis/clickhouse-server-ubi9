apiVersion: v1
kind: ConfigMap
metadata:
  name: clickhouse-qualification-config
  labels:
    app.kubernetes.io/name: clickhouse-qualification
data:
  tls.xml: |
    <?xml version="1.0"?>
    <clickhouse>
        <https_port>8443</https_port>
        <tcp_port_secure>9440</tcp_port_secure>
        <http_port remove="remove"/>
        <tcp_port remove="remove"/>
        <openSSL>
            <server>
                <certificateFile>/run/secrets/clickhouse-tls/tls.crt</certificateFile>
                <privateKeyFile>/run/secrets/clickhouse-tls/tls.key</privateKeyFile>
                <verificationMode>none</verificationMode>
                <loadDefaultCAFile>true</loadDefaultCAFile>
                <cacheSessions>true</cacheSessions>
                <disableProtocols>sslv2,sslv3,tlsv1,tlsv1_1</disableProtocols>
                <preferServerCiphers>true</preferServerCiphers>
            </server>
        </openSSL>
    </clickhouse>
  client.xml: |
    <?xml version="1.0"?>
    <config>
        <openSSL>
            <client>
                <loadDefaultCAFile>false</loadDefaultCAFile>
                <caConfig>/run/secrets/clickhouse-ca/ca.crt</caConfig>
                <verificationMode>strict</verificationMode>
                <invalidCertificateHandler>
                    <name>RejectCertificateHandler</name>
                </invalidCertificateHandler>
            </client>
        </openSSL>
    </config>

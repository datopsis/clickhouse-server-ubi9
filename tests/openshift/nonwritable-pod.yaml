apiVersion: v1
kind: Pod
metadata:
  name: clickhouse-nonwritable-test
  labels:
    app.kubernetes.io/name: clickhouse-nonwritable-test
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: clickhouse
      image: IMAGE_REFERENCE
      imagePullPolicy: IfNotPresent
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
      volumeMounts:
        - name: temporary
          mountPath: /tmp
        - name: data
          mountPath: /var/lib/clickhouse
          readOnly: true
  volumes:
    - name: temporary
      emptyDir:
        medium: Memory
        sizeLimit: 64Mi
    - name: data
      emptyDir: {}
